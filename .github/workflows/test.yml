name: Test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # Pinned to an exact, stable release rather than a floating "3.14"
          # spec. A stale local package mirror in a dev sandbox once
          # resolved a pre-release (3.14.0rc2) build that broke pydantic;
          # pinning here means CI can't silently pick up a similarly bad
          # interpreter build. Bump this deliberately when upgrading.
          python-version: "3.14.7"
      - run: uv sync
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/celiacwriteoff/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/celiacwriteoff/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
